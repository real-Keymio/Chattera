# Chattera server defaults. Normally you never edit this file: src/chattera.py sets the data folder and the port
# (see docs/INSTALL.md), and connections, models and participants are managed in the app's Settings.

[server]
port = 8300
host = "127.0.0.1"   # Chattera only serves this computer; other addresses are refused
data_dir = "./data"

# The built-in participants (their history is attributed by these ids; do not rename them).
# More participants are added in Settings and stored in the data folder.
[agents.claude]
color = "#da7756"
label = "Claude"

[agents.codex]
color = "#10a37f"
label = "Codex"

[agents.antigravity]
color = "#4285f4"
label = "Gemini"

[routing]
default = "none"
max_agent_hops = 4

[images]
upload_dir = "./uploads"
max_size_mb = 10

[attachments]
# Non-image files share images.upload_dir.
max_size_mb = 25
allowed_extensions = ["*"]
