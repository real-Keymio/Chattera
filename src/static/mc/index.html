<!DOCTYPE html>
<html lang="zh-CN" data-skin="expressive">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- The launcher checks the home page for this name; keep it. -->
    <meta name="application-name" content="Chattera">
    <meta name="generator" content="Chattera (built on agentchattr)">
    <title>Chattera</title>
    <script>
        // Apply the saved skin before first paint so the page never flashes the other one.
        (function () {
            try {
                var root = document.documentElement, get = function (k, d) { var v = localStorage.getItem('mc-' + k); return v === null ? d : JSON.parse(v); };
                root.dataset.skin = get('skin', 'expressive');
                var theme = get('theme', 'system'); if (theme !== 'system') root.dataset.theme = theme;
                root.dataset.motion = get('motion', 'full');
            } catch (e) { /* defaults */ }
        })();
    </script>
    <link rel="stylesheet" href="/static/mc/vendor/katex/katex.min.css">
    <link rel="stylesheet" href="/static/mc/base.css?v=8">
    <link rel="stylesheet" href="/static/mc/app.css?v=8">
    <link rel="icon" href="/static/mc/favicon.ico?v=8" sizes="any">
</head>
<body>
    <canvas id="field" aria-hidden="true"></canvas>
    <div id="app">
        <aside id="sidebar" aria-label="对话列表">
            <div class="sb-top">
                <span class="sb-brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Chattera</span>
                <button class="icon-btn" id="sb-collapse" title="收起侧边栏" aria-label="收起侧边栏">
                    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
                </button>
            </div>
            <button id="new-chat" class="sb-new">
                <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>新聊天</span><kbd>Ctrl ⇧ O</kbd>
            </button>
            <div class="sb-search">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                <input id="search" type="search" placeholder="搜索聊天与消息" autocomplete="off" aria-label="搜索聊天与消息">
                <kbd>Ctrl K</kbd>
            </div>
            <nav id="room-list" aria-label="聊天"></nav>
            <div class="sb-bottom">
                <button class="sb-foot-btn" id="open-settings" title="模型、研究视角、检索、外观">
                    <svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
                    <span>设置</span>
                </button>
                <button class="sb-foot-btn" id="open-help" title="使用指南、费用说明、数据位置、退出 Chattera">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17h.01"/></svg>
                    <span>帮助</span>
                </button>
                <span id="conn" class="conn" role="status"></span>
                <button class="skin-switch" id="skin-switch" title="切换视觉模式：表版（共鸣）/ 里版（纸本）" aria-label="切换视觉模式"><span>表</span><span>里</span></button>
            </div>
        </aside>

        <main id="chat">
            <header id="stage">
                <button class="icon-btn" id="sb-open" title="展开侧边栏" aria-label="展开侧边栏">
                    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
                </button>
                <div class="stage-title">
                    <h1 id="room-name" title="点击重命名"></h1>
                    <div id="room-sub"></div>
                </div>
                <div id="voices" role="status" aria-label="参与者状态"></div>
                <div class="stage-tools">
                    <div class="layout-seg" id="layout-seg" role="group" aria-label="阅读视口数量"></div>
                    <button class="icon-btn" id="pins-btn" title="固定在房间背景中的内容" aria-label="固定内容">
                        <svg viewBox="0 0 24 24"><path d="M9 4h6l-1 6 3 3v2H7v-2l3-3z"/><path d="M12 15v5"/></svg>
                    </button>
                    <button class="icon-btn" id="panel-toggle" title="房间：讨论方式、模型、上下文、记忆、调用记录" aria-label="房间设置">
                        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M15 4v16"/></svg>
                    </button>
                </div>
            </header>
            <div id="panes" data-count="1"></div>
            <footer id="composer"></footer>
        </main>

        <aside id="room-panel" hidden aria-label="房间设置"></aside>
    </div>
    <div id="layer"></div>
    <div id="toasts" role="status" aria-live="polite"></div>
    <div id="dropzone" hidden><div>松开以添加图片或文档</div></div>

    <script src="/static/mc/vendor/marked.umd.js"></script>
    <script src="/static/mc/vendor/katex/katex.min.js"></script>
    <script src="/static/mc/vendor/hljs/highlight.min.js"></script>
    <script type="module" src="/static/mc/main.js?v=8"></script>
</body>
</html>
